name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting, static analysis, and tests
        run: |
          make check
          python3 tests/test_mp_delete.py
      - name: Compile Linux packages and both CLIs
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
          git diff --exit-code
